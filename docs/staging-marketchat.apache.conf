# MarketChat STAGING — Opção A (dois vhosts HTTPS)
# Copiar para /etc/apache2/sites-available/staging-marketchat.conf
# Apache: saos101ws01p | Docker: 192.168.1.23 | API :8001 | Front :3000
#
# Front: staging-app + staging → :3000 (serve -s, sem /api no container)
# API/Admin/static: staging-api → :8001
# Build do front: VITE_API_BASE_URL=https://staging-api.marketchat.com.br
#
# Alternativa (mesma origem): no vhost do app, ANTES do ProxyPass / :
#   ProxyPass /api http://192.168.1.23:8001/api
#   ProxyPassReverse /api http://192.168.1.23:8001/api
# e VITE_API_BASE_URL=https://staging-app.marketchat.com.br
#
# sudo a2enmod proxy proxy_http ssl headers rewrite
# sudo apache2ctl configtest && sudo systemctl reload apache2

# HTTP → HTTPS
<VirtualHost *:80>
    ServerName staging-app.marketchat.com.br
    ServerAlias staging.marketchat.com.br staging-api.marketchat.com.br

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# React: staging-app + landing (staging)
<VirtualHost *:443>
    ServerName staging-app.marketchat.com.br
    ServerAlias staging.marketchat.com.br

    SSLEngine on
    SSLCertificateFile /etc/apache/ssl/marketchat.crt
    SSLCertificateKeyFile /etc/apache/ssl/marketchat.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://192.168.1.23:3000/
    ProxyPassReverse / http://192.168.1.23:3000/

    ErrorLog /var/log/apache2/staging_app_error.log
    CustomLog /var/log/apache2/staging_app_access.log combined
</VirtualHost>

# Django: API + Admin + /static/
<VirtualHost *:443>
    ServerName staging-api.marketchat.com.br

    SSLEngine on
    SSLCertificateFile /etc/apache/ssl/marketchat.crt
    SSLCertificateKeyFile /etc/apache/ssl/marketchat.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://192.168.1.23:8001/
    ProxyPassReverse / http://192.168.1.23:8001/

    ErrorLog /var/log/apache2/staging_api_error.log
    CustomLog /var/log/apache2/staging_api_access.log combined
</VirtualHost>
