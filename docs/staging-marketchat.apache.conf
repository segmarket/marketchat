# MarketChat STAGING — copiar para /etc/apache2/sites-available/staging-marketchat.conf
# Apache: saos101ws01p | Docker: 192.168.1.23 | API host :8001 | Front :3000
#
# sudo a2enmod proxy proxy_http ssl headers rewrite
# sudo apache2ctl configtest && sudo systemctl reload apache2

# ============================================================
# HTTP → HTTPS
# ============================================================
<VirtualHost *:80>
    ServerName staging-app.marketchat.com.br
    ServerAlias staging.marketchat.com.br staging-api.marketchat.com.br

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ============================================================
# HTTPS — front (:3000) + API (/api → :8001)
# ============================================================
<VirtualHost *:443>
    ServerName staging-app.marketchat.com.br
    ServerAlias staging.marketchat.com.br staging-api.marketchat.com.br

    SSLEngine on
    SSLCertificateFile /etc/apache/ssl/marketchat.crt
    SSLCertificateKeyFile /etc/apache/ssl/marketchat.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"

    # API Django — porta 8001 (NÃO 8000 — Portainer usa 8000)
    ProxyPass /api http://192.168.1.23:8001/api
    ProxyPassReverse /api http://192.168.1.23:8001/api

    ProxyPass /admin http://192.168.1.23:8001/admin
    ProxyPassReverse /admin http://192.168.1.23:8001/admin

    # Front React (SPA)
    ProxyPass / http://192.168.1.23:3000/
    ProxyPassReverse / http://192.168.1.23:3000/

    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin

    ErrorLog /var/log/apache2/staging_marketchat_error.log
    CustomLog /var/log/apache2/staging_marketchat_access.log combined
</VirtualHost>
