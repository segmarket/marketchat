{% extends "emails/_layout.html" %}
{% block email_body %}
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
  <tr>
    <td style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #334155;">
      <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3; font-weight: 700; color: #B91C1C;">
        WhatsApp desconectado
      </h1>
      <p style="margin: 0 0 16px;">
        Ola, <strong style="color: #0F172A;">{{ first_name }}</strong>!
      </p>
      <p style="margin: 0 0 16px;">
        {{ alert_body }}
      </p>
      <p style="margin: 0 0 24px;">
        Empresa: <strong style="color: #0F172A;">{{ company_name }}</strong>
      </p>
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin: 0 0 24px;">
        <tr>
          <td align="center">
            <a href="{{ action_url }}" style="display: inline-block; padding: 14px 28px; background-color: #DC2626; color: #FFFFFF; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 600; text-decoration: none; border-radius: 8px; line-height: 1.2;">
              Reconectar WhatsApp agora
            </a>
          </td>
        </tr>
      </table>
      <p style="margin: 0; font-size: 14px; color: #64748B;">
        Se o botao nao funcionar, copie e cole no navegador:<br>
        <a href="{{ action_url }}" style="color: #1E3A8A; word-break: break-all;">{{ action_url }}</a>
      </p>
    </td>
  </tr>
</table>
{% endblock %}
