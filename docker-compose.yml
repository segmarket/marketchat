# Staging: expõe API (host 8001 por padrão — Portainer costuma usar 8000) e front :3000.
# Postgres e Evolution rodam em containers separados no host (Portainer).
# Copie .env.staging.example para .env.staging e preencha os segredos.

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: marketchat_backend_staging
    restart: always
    ports:
      - "${STAGING_BACKEND_PORT:-8001}:8000"
    env_file:
      - .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      # DATABASE_URL, EVOLUTION_* etc. vêm só de .env.staging (env_file).
      # Não defina DATABASE_URL aqui: a seção environment sobrescreve env_file no Compose.
    volumes:
      - marketchat_media_staging:/app/media

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://staging-app.marketchat.com.br}
        VITE_APP_ORIGIN: ${VITE_APP_ORIGIN:-https://staging-app.marketchat.com.br}
        VITE_MARKETING_ORIGIN: ${VITE_MARKETING_ORIGIN:-https://staging.marketchat.com.br}
        VITE_PLAN_PRICE: ${VITE_PLAN_PRICE:-59,90}
        VITE_TRIAL_SUBSCRIPTION_PRICE: ${VITE_TRIAL_SUBSCRIPTION_PRICE:-59,90}
    container_name: marketchat_frontend_staging
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  marketchat_media_staging:
